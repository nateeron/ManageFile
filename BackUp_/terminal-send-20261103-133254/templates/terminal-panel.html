  <aside id="terminalPanel" class="terminal-panel" role="dialog" aria-modal="false" aria-labelledby="terminalTitle" {% if not terminal_standalone %}hidden{% endif %}>
    <header class="terminal-header"><div><h2 id="terminalTitle">Terminal</h2><span id="terminalShell">Detecting shell…</span></div><div class="terminal-header-actions"><a class="ui-button terminal-tab-link" href="{{ url_for('terminal_page', path=terminal_path or system_path) }}" target="_blank" rel="noopener noreferrer">↗ Open Terminal Tab</a><button type="button" class="ui-button" id="closeTerminal" aria-label="{{ 'Back to files' if terminal_standalone else 'Close terminal' }}">{{ '← Files' if terminal_standalone else '×' }}</button></div></header>
    <p id="terminalHint" class="terminal-hint" role="status">Connecting…</p>
    <div class="terminal-location"><label for="terminalCwd">Working folder</label><div><input type="text" id="terminalCwd" spellcheck="false" /><button type="button" class="ui-button" id="terminalUseCurrent" title="Use the current File Explorer folder">Current folder</button></div></div>
    <pre id="terminalOutput" class="terminal-output" role="log" aria-live="polite" aria-label="Command output" tabindex="0">Run a command to see its output here.</pre>
    <form id="terminalForm" class="terminal-form"><label for="terminalCommand">Command</label><textarea id="terminalCommand" rows="3" maxlength="16000" spellcheck="false" autocomplete="off" placeholder="Enter a command…"></textarea><div class="terminal-actions"><span>Ctrl+Enter to run · Non-interactive</span><button type="button" class="ui-button" id="terminalClear">Clear</button><button type="button" class="ui-button" id="terminalStop" disabled>Stop</button><button type="submit" class="custom-btn" id="terminalRun" disabled>Run</button></div></form>
  </aside>
